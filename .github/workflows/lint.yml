name: "linting-tool-scan"

on:
  push:
    branches: [githubcicd]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x] # Updated to a supported LTS version

    steps:
      - uses: actions/checkout@v3 # Updated to v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # This replaces the manual cache check

      - name: Install Dependencies
        run: npm ci # Removed --force flag

      - name: Installing JSHint
        run: npm install -g jshint # Removed sudo as it's not needed with GitHub Actions

      - name: Change script permission
        run: chmod +x scripts/jshint-script.sh

      - name: Run scan with JSHint
        run: scripts/jshint-script.sh

      - name: Archive production artifacts
        uses: actions/upload-artifact@v2 # Downgraded to v2 to avoid the download issue
        with:
          name: linting-tool-report
          path: ./JSHint-report
